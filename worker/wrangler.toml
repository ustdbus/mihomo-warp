name = "warp"
main = "src/index.js"
compatibility_date = "2026-09-01"
# getSetCookie() 需要，缺了 Opera 的会话维持不住
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "warp.2002.dpdns.org", custom_domain = true }
]

# 只需要这一个绑定。密码和订阅路径都在界面上设，不用环境变量，也不用 cron。
[[kv_namespaces]]
binding = "KV"
id = "55a72669caba45229e709a484dbc243a"
